<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Domates Yaprağı Teşhis{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-in">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><circle cx="16" cy="18" r="11" fill="currentColor"/><path d="M16 7c-2-3-5-3-7-2 2 1 4 2 5 4-3-1-6 0-7 2 3 0 6 0 8 1 1-2 1-3 1-5zm0 0c2-3 5-3 7-2-2 1-4 2-5 4 3-1 6 0 7 2-3 0-6 0-8 1-1-2-1-3-1-5z" fill="#3f8f5a"/></svg>
        </span>
        <span>
          <strong>DomatesTeşhis</strong>
          <small>Derin öğrenme ile yaprak hastalığı analizi</small>
        </span>
      </a>
      <nav class="nav">
        <a href="/" class="{{ 'on' if page == 'index' }}">Teşhis</a>
        <a href="/panel" class="{{ 'on' if page == 'panel' }}">Performans Paneli</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer class="wrap foot">
    CNN · ResNet50 · VGG16 ile eğitilmiş modeller. Sonuçlar bilgilendirme amaçlıdır; kesin teşhis için bir ziraat mühendisine danışın.
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
